---
- name: Deploy Minecraft server
  hosts: all
  become: true
  vars_files:
    - vars/main.yml

  tasks:
    # -----------------------------------------------------------------
    # 1️⃣ Standard Prerequisites
    # -----------------------------------------------------------------
    - name: Install system dependencies
      apt:
        name: [python3-venv, docker.io, unzip, curl]
        state: present
        update_cache: yes

    - name: Ensure Docker is started
      systemd:
        name: docker
        state: started
        enabled: true

    - name: Add ubuntu to docker group
      user:
        name: ubuntu
        groups: docker
        append: yes

    # -----------------------------------------------------------------
    # 2️⃣ Install AWS CLI v2 (System-wide)
    # -----------------------------------------------------------------
    - name: Check for AWS CLI
      command: aws --version
      register: aws_check
      ignore_errors: true
      changed_when: false

    - name: Install AWS CLI if missing
      when: aws_check.rc != 0
      block:
        - name: Download AWS CLI
          get_url:
            url: https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip
            dest: /tmp/awscliv2.zip
        - name: Unarchive and Install
          unarchive:
            src: /tmp/awscliv2.zip
            dest: /tmp
            remote_src: yes
        - name: Run installer
          command: /tmp/aws/install --update

    # -----------------------------------------------------------------
    # 3️⃣ Authenticate to ECR (Bypassing the buggy docker_login module)
    # -----------------------------------------------------------------
    - name: Log Docker into ECR via Shell
      shell: |
        aws ecr get-login-password --region {{ aws_region }} | \
        docker login --username AWS --password-stdin {{ ecr_repository.split('/') | first }}
      changed_when: false
      # We use shell here because the community.docker.docker_login module
      # is triggering the "http+docker" scheme error on Ubuntu 24.04.

    # -----------------------------------------------------------------
    # 4️⃣ Restore World Data
    # -----------------------------------------------------------------
    - name: Ensure data directory exists
      file:
        path: "{{ data_dir }}"
        state: directory
        mode: "0755"

    - name: Pull world from S3 (bypassing python-s3 modules for reliability)
      command: "aws s3 cp s3://{{ s3_bucket }}/{{ s3_world_key }} /tmp/world.zip"
      register: s3_pull
      ignore_errors: true
      changed_when: false

    - name: Extract world
      unarchive:
        src: /tmp/world.zip
        dest: "{{ data_dir }}"
        remote_src: yes
      when: s3_pull.rc == 0
      notify: Clean up archive

    # -----------------------------------------------------------------
    # 5️⃣ Start Minecraft (Using Shell for Container Management)
    # -----------------------------------------------------------------
    # Using shell here also ensures we don't hit the same SDK error
    # that docker_login was having.
    - name: Pull and Run Minecraft Container
      shell: |
        docker pull {{ ecr_repository }}:{{ ecr_image_tag }}
        docker stop {{ container_name }} || true
        docker rm {{ container_name }} || true
        docker run -d \
          --name {{ container_name }} \
          --restart unless-stopped \
          -p {{ container_port }}:25565 \
          -e EULA=TRUE \
          -v {{ data_dir }}:/data \
          {{ ecr_repository }}:{{ ecr_image_tag }}
      changed_when: true

    - name: Wait for server "Done" message in logs
      shell: "docker logs {{ container_name }} 2>&1 | grep -q 'Done'"
      register: mc_ready
      retries: 20
      delay: 10
      until: mc_ready.rc == 0
      changed_when: false

  handlers:
    - name: Clean up archive
      file:
        path: /tmp/world.zip
        state: absent
