---
- name: Deploy Minecraft server
  hosts: all
  become: true
  vars_files:
    - vars/main.yml

  tasks:
    # -----------------------------------------------------------------
    # 1️⃣ Standard Prerequisites
    # -----------------------------------------------------------------
    - name: Install system dependencies
      apt:
        name: [python3-venv, docker.io, unzip, zip, curl]
        state: present
        update_cache: yes

    - name: Ensure Docker is started
      systemd:
        name: docker
        state: started
        enabled: true

    - name: Add ubuntu to docker group
      user:
        name: ubuntu
        groups: docker
        append: yes

    # -----------------------------------------------------------------
    # 2️⃣ Install AWS CLI v2
    # -----------------------------------------------------------------
    - name: Check for AWS CLI
      command: aws --version
      register: aws_check
      ignore_errors: true
      changed_when: false

    - name: Install AWS CLI if missing
      when: aws_check.rc != 0
      block:
        - name: Download AWS CLI
          get_url:
            url: https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip
            dest: /tmp/awscliv2.zip
        - name: Unarchive and Install
          unarchive:
            src: /tmp/awscliv2.zip
            dest: /tmp
            remote_src: yes
        - name: Run installer
          command: /tmp/aws/install --update

    # -----------------------------------------------------------------
    # 3️⃣ Authenticate to ECR
    # -----------------------------------------------------------------
    - name: Log Docker into ECR via Shell
      shell: |
        aws ecr get-login-password --region {{ aws_region }} | \
        docker login --username AWS --password-stdin {{ ecr_repository.split('/') | first }}
      changed_when: false

    # -----------------------------------------------------------------
    # 5️⃣ Start Minecraft
    # -----------------------------------------------------------------
    - name: Pull and Run Minecraft Container
      shell: |
        docker pull {{ ecr_repository }}:{{ ecr_image_tag }}
        docker stop {{ container_name }} || true
        docker rm {{ container_name }} || true
        docker run -d \
          --name {{ container_name }} \
          --restart unless-stopped \
          -p {{ container_port }}:25565 \
          -e EULA=TRUE \
          -e MOTD="{{ mc_server_motd }}" \
          -v {{ data_dir }}:/data \
          {{ ecr_repository }}:{{ ecr_image_tag }}
      changed_when: true

    - name: Wait for server "Done" message in logs
      shell: "docker logs {{ container_name }} 2>&1 | grep -q 'Done'"
      register: mc_ready
      retries: 30
      delay: 10
      until: mc_ready.rc == 0
      changed_when: false

    # -----------------------------------------------------------------
    # 6️⃣ Backup Logic (Zip-based)
    # -----------------------------------------------------------------
    - name: Create backup script
      copy:
        dest: /usr/local/bin/mc_backup.sh
        mode: "0755"
        content: |
          #!/bin/bash
          # 1. Create a zip of the data directory
          # We zip the contents of data_dir so world/ resides at the root of the zip
          cd {{ data_dir }} && zip -r /tmp/world_backup.zip .

          # 2. Upload the zip to S3
          aws s3 cp /tmp/world_backup.zip s3://{{ s3_bucket }}/backups/world_backup.zip

          # 3. Cleanup
          rm /tmp/world_backup.zip
          echo "Zipped backup completed at $(date)" >> /var/log/mc_backup.log

    - name: Run initial backup after startup
      command: /usr/local/bin/mc_backup.sh
      changed_when: true

    - name: Schedule recurring 30-minute backup
      ansible.builtin.cron:
        name: "Minecraft 30m S3 Backup"
        minute: "*/30"
        job: "/usr/local/bin/mc_backup.sh"
