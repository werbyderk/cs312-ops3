---
- name: Deploy Minecraft server on k3s using Helm
  hosts: all
  become: true
  vars_files:
    - vars/main.yml

  tasks:
    # -----------------------------------------------------------------
    # 1️⃣  System prerequisites (AWS CLI, zip, etc.)
    # -----------------------------------------------------------------
    - name: Install system dependencies
      apt:
        name: [python3-venv, unzip, zip, curl, ca-certificates, gnupg]
        state: present
        update_cache: yes

    # -----------------------------------------------------------------
    # 2️⃣  Install AWS CLI v2
    # -----------------------------------------------------------------
    - name: Check for AWS CLI
      command: aws --version
      register: aws_check
      ignore_errors: true
      changed_when: false

    - name: Install AWS CLI if missing
      when: aws_check.rc != 0
      block:
        - name: Download AWS CLI
          get_url:
            url: https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip
            dest: /tmp/awscliv2.zip
        - name: Unarchive and Install
          unarchive:
            src: /tmp/awscliv2.zip
            dest: /tmp
            remote_src: yes
        - name: Run installer
          command: /tmp/aws/install --update

    # -----------------------------------------------------------------
    # 3️⃣  Install k3s and Cleanup
    # -----------------------------------------------------------------
    - name: Install k3s binary and start the service
      shell: |
        curl -sfL https://get.k3s.io | INSTALL_K3S_EXEC="--disable=traefik --kubelet-arg=eviction-hard=imagefs.available<1%,nodefs.available<1% --kubelet-arg=eviction-minimum-reclaim=imagefs.available=500Mi,nodefs.available=500Mi" sh -
      args:
        creates: /usr/local/bin/k3s
      register: k3s_install
      changed_when: k3s_install.rc == 0

    - name: Ensure k3s service is enabled and running
      systemd:
        name: k3s
        enabled: true
        state: started

    - name: Prune unused container images to save disk space
      shell: k3s crictl rmi --prune
      register: prune_result
      changed_when: "'Deleted:' in prune_result.stdout"
      ignore_errors: true

    # -----------------------------------------------------------------
    # 4️⃣  Make kubeconfig available to the ubuntu user
    # -----------------------------------------------------------------
    - name: Create .kube directory for ubuntu
      file:
        path: /home/ubuntu/.kube
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: "0755"

    - name: Copy k3s kubeconfig for ubuntu
      become: true
      copy:
        src: /etc/rancher/k3s/k3s.yaml
        dest: /home/ubuntu/.kube/config
        owner: ubuntu
        group: ubuntu
        mode: "0600"
        remote_src: true

    - name: Add KUBECONFIG to ubuntu .bashrc
      lineinfile:
        path: /home/ubuntu/.bashrc
        line: "export KUBECONFIG=~/.kube/config"
        owner: ubuntu
        group: ubuntu
        state: present
        insertafter: EOF

    - name: Set default namespace to minecraft for ubuntu user
      become_user: ubuntu
      environment:
        KUBECONFIG: /home/ubuntu/.kube/config
      shell: |
        kubectl config set-context --current --namespace=minecraft
      args:
        executable: /bin/bash
      changed_when: false

    # -----------------------------------------------------------------
    # 5️⃣  Kubernetes Setup (Namespace & ECR Secret)
    # -----------------------------------------------------------------
    - name: Ensure the Kubernetes namespace exists
      become_user: ubuntu
      environment:
        KUBECONFIG: /home/ubuntu/.kube/config
      shell: |
        kubectl create namespace {{ k8s_namespace | default('minecraft') }} --dry-run=client -o yaml | kubectl apply -f -
      args:
        executable: /bin/bash
      changed_when: false

    - name: Generate Docker config JSON for ECR
      become_user: ubuntu
      environment:
        KUBECONFIG: /home/ubuntu/.kube/config
        AWS_DEFAULT_REGION: "{{ aws_region }}"
      shell: |
        set -e
        ECR_PASSWORD=$(aws ecr get-login-password --region {{ aws_region }})
        REGISTRY="{{ ecr_repository.split('/') | first }}"
        AUTH=$(python3 -c "import base64,sys; print(base64.b64encode(('AWS:' + sys.argv[1]).encode()).decode())" "$ECR_PASSWORD")
        python3 -c "import json, sys; print(json.dumps({'auths': {sys.argv[1]: {'auth': sys.argv[2]}}}))" "$REGISTRY" "$AUTH" > /tmp/ecr-dockerconfig.json
      args:
        executable: /bin/bash
      register: ecr_cfg
      changed_when: ecr_cfg.rc == 0

    - name: Delete old ecr-cred secret if it exists
      become_user: ubuntu
      environment:
        KUBECONFIG: /home/ubuntu/.kube/config
      shell: |
        kubectl delete secret ecr-cred -n {{ k8s_namespace | default('minecraft') }} --ignore-not-found
      args:
        executable: /bin/bash
      changed_when: false

    - name: Create the Kubernetes imagePullSecret
      become_user: ubuntu
      environment:
        KUBECONFIG: /home/ubuntu/.kube/config
      shell: |
        kubectl create secret generic {{ ecr_secret_name | default('ecr-cred') }} \
          --type=kubernetes.io/dockerconfigjson \
          --from-file=.dockerconfigjson=/tmp/ecr-dockerconfig.json \
          -n {{ k8s_namespace | default('minecraft') }}
      args:
        executable: /bin/bash
      register: secret_create
      changed_when: "'created' in secret_create.stdout"

    # -----------------------------------------------------------------
    # 6️⃣  Install Helm
    # -----------------------------------------------------------------
    - name: Check for helm
      command: helm version --short
      register: helm_check
      ignore_errors: true
      changed_when: false

    - name: Install Helm if missing
      when: helm_check.rc != 0
      block:
        - name: Download Helm install script
          get_url:
            url: https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
            dest: /tmp/get_helm.sh
            mode: "0755"
        - name: Run Helm installer
          shell: /tmp/get_helm.sh
          args:
            creates: /usr/local/bin/helm

    # -----------------------------------------------------------------
    # 7️⃣  Deploy Monitoring Stack (Prometheus & Grafana)
    # -----------------------------------------------------------------
    - name: Ensure the monitoring namespace exists
      become_user: ubuntu
      environment:
        KUBECONFIG: /home/ubuntu/.kube/config
      shell: |
        kubectl create namespace {{ monitoring_namespace }} --dry-run=client -o yaml | kubectl apply -f -
      args:
        executable: /bin/bash

    - name: Add Prometheus community Helm repo
      become_user: ubuntu
      environment:
        KUBECONFIG: /home/ubuntu/.kube/config
      shell: |
        helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
        helm repo update
      args:
        executable: /bin/bash

    - name: Ensure monitoring values directory exists on the remote host
      copy:
        src: "{{ playbook_dir }}/../helm/monitoring/"
        dest: /home/ubuntu/monitoring-values/
        owner: ubuntu
        group: ubuntu
        mode: "0755"

    - name: Deploy kube-prometheus-stack
      become_user: ubuntu
      environment:
        KUBECONFIG: /home/ubuntu/.kube/config
      shell: |
        helm upgrade --install prometheus \
          prometheus-community/kube-prometheus-stack \
          --namespace {{ monitoring_namespace }} \
          -f /home/ubuntu/monitoring-values/values.yaml
      args:
        executable: /bin/bash

    - name: Create Grafana dashboard ConfigMap
      become_user: ubuntu
      environment:
        KUBECONFIG: /home/ubuntu/.kube/config
      shell: |
        kubectl create configmap minecraft-dashboard \
          --from-file=minecraft-dashboard.json=/home/ubuntu/monitoring-values/dashboards/minecraft-dashboard.json \
          -n {{ monitoring_namespace }} --dry-run=client -o yaml | \
        kubectl label -f - grafana_dashboard=1 --local -o yaml | \
        kubectl apply -f -
      args:
        executable: /bin/bash

    # -----------------------------------------------------------------
    # 8️⃣  Deploy Minecraft Helm Chart
    # -----------------------------------------------------------------
    - name: Clean stale Helm chart directory on remote
      file:
        path: /home/ubuntu/minecraft-chart/
        state: absent

    - name: Ensure Helm chart directory exists on the remote host
      copy:
        src: "{{ playbook_dir }}/../helm/minecraft/"
        dest: /home/ubuntu/minecraft-chart/
        owner: ubuntu
        group: ubuntu
        mode: "0755"

    - name: Annotate and Label namespace for Helm adoption
      become_user: ubuntu
      environment:
        KUBECONFIG: /home/ubuntu/.kube/config
      shell: |
        kubectl label namespace {{ k8s_namespace | default('minecraft') }} app.kubernetes.io/managed-by=Helm --overwrite
        kubectl annotate namespace {{ k8s_namespace | default('minecraft') }} meta.helm.sh/release-name=minecraft --overwrite
        kubectl annotate namespace {{ k8s_namespace | default('minecraft') }} meta.helm.sh/release-namespace={{ k8s_namespace | default('minecraft') }} --overwrite
      args:
        executable: /bin/bash

    - name: Render and apply Helm chart
      become_user: ubuntu
      environment:
        KUBECONFIG: /home/ubuntu/.kube/config
      shell: |
        helm upgrade --install minecraft \
          /home/ubuntu/minecraft-chart \
          --namespace {{ k8s_namespace | default('minecraft') }} \
          --set image.repository={{ ecr_repository }} \
          --set image.tag={{ ecr_image_tag }} \
          --set service.port={{ container_port }} \
          --set minecraft.motd="{{ mc_server_motd }}"
      args:
        executable: /bin/bash
      register: helm_deploy
      changed_when: "'installed' in helm_deploy.stdout or 'upgraded' in helm_deploy.stdout"

    - name: Wait for Minecraft pod Ready condition
      become_user: ubuntu
      environment:
        KUBECONFIG: /home/ubuntu/.kube/config
      shell: |
        kubectl -n {{ k8s_namespace | default('minecraft') }} wait --for=condition=Ready pod -l app=minecraft --timeout=300s
      register: wait_ready
      failed_when: wait_ready.rc != 0
      changed_when: false

    # -----------------------------------------------------------------
    # 9️⃣  Backup Logic
    # -----------------------------------------------------------------
    - name: Create backup script
      copy:
        dest: /usr/local/bin/mc_backup.sh
        mode: "0755"
        content: |
          #!/bin/bash
          DATA_MOUNT="/var/lib/rancher/k3s/storage"
          WORLD_DIR=$(find "$DATA_MOUNT" -type d -name "world" | head -n1)
          if [[ -z "$WORLD_DIR" ]]; then
            echo "World directory not found!" >&2
            exit 1
          fi
          cd "$WORLD_DIR/.." && zip -r /tmp/world_backup.zip "$(basename "$WORLD_DIR")"
          aws s3 cp /tmp/world_backup.zip s3://{{ s3_bucket }}/backups/world_backup_$(date +%Y%m%d%H%M%S).zip
          aws s3 cp /tmp/world_backup.zip s3://{{ s3_bucket }}/backups/world_backup_latest.zip
          rm /tmp/world_backup.zip
          echo "Backup completed at $(date)" >> /var/log/mc_backup.log

    - name: Schedule recurring 30m backup
      ansible.builtin.cron:
        name: "Minecraft 30m S3 Backup"
        minute: "*/30"
        job: "/usr/local/bin/mc_backup.sh"
