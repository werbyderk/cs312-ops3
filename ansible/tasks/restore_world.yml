- name: Ensure data directory exists
  ansible.builtin.file:
    path: "{{ data_dir }}"
    state: directory
    owner: 1000
    group: 1000
    mode: "0755"

- name: Check if world data already exists (non-empty)
  ansible.builtin.stat:
    path: "{{ data_dir }}/world"
  register: world_dir

- name: Download world archive from S3 (only if missing)
  ansible.builtin.get_url:
    url: "https://{{ s3_bucket }}.s3.amazonaws.com/{{ s3_world_key }}"
    dest: "/tmp/{{ s3_world_key }}"
    mode: "0644"
  when: not world_dir.stat.isdir
  register: download_result

- name: Extract world archive into {{ data_dir }}
  ansible.builtin.unarchive:
    src: "/tmp/{{ s3_world_key }}"
    dest: "{{ data_dir }}"
    remote_src: yes
    creates: "{{ data_dir }}/world"
  when: download_result is changed
