---
- name: Restore Minecraft world from S3 backup
  hosts: all
  become: true
  vars_files:
    - vars/main.yml

  tasks:
    # -------------------------------------------------------------
    # 1️⃣ Stop the workload to safely restore files
    # -------------------------------------------------------------
    - name: Scale down Minecraft StatefulSet
      become_user: ubuntu
      environment:
        KUBECONFIG: /home/ubuntu/.kube/config
      shell: |
        kubectl scale statefulset minecraft -n minecraft --replicas=0
      args:
        executable: /bin/bash
      ignore_errors: true

    - name: Wait for pod to terminate
      become_user: ubuntu
      environment:
        KUBECONFIG: /home/ubuntu/.kube/config
      shell: |
        kubectl get pods -n minecraft -l app=minecraft --no-headers | wc -l
      register: pod_count
      until: pod_count.stdout|int == 0
      retries: 12
      delay: 5
      changed_when: false

    # -------------------------------------------------------------
    # 2️⃣ Restore Logic (Pull & Unzip)
    # -------------------------------------------------------------
    - name: Pull latest world zip from S3
      command: "aws s3 cp s3://{{ s3_bucket }}/backups/world_backup_latest.zip /tmp/world.zip"
      register: s3_pull
      ignore_errors: true
      changed_when: false

    - name: Find PVC directory on host
      shell: |
        find /var/lib/rancher/k3s/storage -type d -name "world" | head -n1
      register: world_dir_find
      changed_when: false

    - name: Fail if world directory not found
      fail:
        msg: "Could not find the world directory on the host. Has the PVC been created and the server started at least once?"
      when: s3_pull.rc == 0 and world_dir_find.stdout == ""

    - name: Extract world if backup exists
      unarchive:
        src: /tmp/world.zip
        dest: "{{ world_dir_find.stdout }}/.."
        remote_src: yes
      when: s3_pull.rc == 0 and world_dir_find.stdout != ""
      notify: Clean up temporary archive

    - name: Set correct ownership
      file:
        path: "{{ world_dir_find.stdout }}"
        state: directory
        recurse: true
        owner: "1000"
        group: "1000"
      when: s3_pull.rc == 0 and world_dir_find.stdout != ""

    # -------------------------------------------------------------
    # 3️⃣ Scale back up
    # -------------------------------------------------------------
    - name: Scale up Minecraft StatefulSet
      become_user: ubuntu
      environment:
        KUBECONFIG: /home/ubuntu/.kube/config
      shell: |
        kubectl scale statefulset minecraft -n minecraft --replicas=1
      args:
        executable: /bin/bash

    - name: Wait for Minecraft pod Ready condition
      become_user: ubuntu
      environment:
        KUBECONFIG: /home/ubuntu/.kube/config
      shell: |
        kubectl -n minecraft wait --for=condition=Ready pod -l app=minecraft --timeout=300s
      register: wait_ready
      changed_when: false

  handlers:
    - name: Clean up temporary archive
      file:
        path: /tmp/world.zip
        state: absent
