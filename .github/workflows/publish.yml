name: Publish Minecraft Image
on:
  push:
    tags:
      - "v*"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      REPOSITORY: minecraft-server
      UPSTREAM: itzg/minecraft-server:java25-alpine

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # -----------------------------------------------------------------
      # 1️⃣ Set up Docker Buildx (Provides the caching driver)
      # -----------------------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # -----------------------------------------------------------------
      # 2️⃣ Pull/Tag/Push with Caching
      # -----------------------------------------------------------------
      - name: Build, Tag, and Push to ECR
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          # Use buildx to pull with cache-from logic
          docker buildx build \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --tag $REGISTRY/$REPOSITORY:${{ github.ref_name }} \
            --tag $REGISTRY/$REPOSITORY:latest \
            --push \
            - <<EOF
          FROM $UPSTREAM
          EOF

      # -----------------------------------------------------------------
      # 3️⃣ Smoke Test
      # -----------------------------------------------------------------
      - name: Smoke Test
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker run -d --name test-server -m 2g -e EULA=TRUE $REGISTRY/$REPOSITORY:latest

          echo "Waiting for Minecraft to say 'Done'..."
          for i in {1..20}; do
            if docker logs test-server 2>&1 | grep -q "Done"; then
              echo "✅ Smoke test passed!"
              docker stop test-server && docker rm test-server
              exit 0
            fi
            sleep 10
          done
          exit 1
