name: Publish Minecraft Image
on:
  push:
    tags:
      - "v*"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      REPOSITORY: minecraft-server

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # -----------------------------------------------------------------
      # 1️⃣ Set up Docker Buildx (Necessary for GHA Caching)
      # -----------------------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # -----------------------------------------------------------------
      # 2️⃣ Build and Push with Native GHA Caching
      # -----------------------------------------------------------------
      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.REPOSITORY }}:${{ github.ref_name }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.REPOSITORY }}:latest
          # This is the magic part that replaces your /tmp/.docker-cache logic:
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # If you are just "re-tagging" the itzg image, use build-args:
          build-args: |
            BASE_IMAGE=itzg/minecraft-server:java25-alpine

      # -----------------------------------------------------------------
      # 3️⃣ Smoke Test
      # -----------------------------------------------------------------
      - name: Smoke Test
        run: |
          docker run -d --name test-server -m 2g -e EULA=TRUE ${{ steps.login-ecr.outputs.registry }}/${{ env.REPOSITORY }}:latest

          echo "Waiting for Minecraft to say 'Done'..."
          for i in {1..20}; do
            if docker logs test-server 2>&1 | grep -q "Done"; then
              echo "✅ Smoke test passed!"
              docker stop test-server && docker rm test-server
              exit 0
            fi
            sleep 10
          done
          exit 1
