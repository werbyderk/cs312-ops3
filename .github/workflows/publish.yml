name: Publish Minecraft Image
on:
  push:
    tags:
      - "v*"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # Remove the ECR_REGISTRY env from here!
    env:
      REPOSITORY: minecraft-server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag, and Push to ECR
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          UPSTREAM: itzg/minecraft-server:java21-alpine
        run: |
          # 1. Pull the official image
          docker pull $UPSTREAM

          # 2. Tag it for your private ECR
          docker tag $UPSTREAM $REGISTRY/$REPOSITORY:${{ github.ref_name }}
          docker tag $UPSTREAM $REGISTRY/$REPOSITORY:latest

          # 3. Push to ECR (This is what was missing!)
          docker push $REGISTRY/$REPOSITORY:${{ github.ref_name }}
          docker push $REGISTRY/$REPOSITORY:latest

      - name: Smoke Test
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          # Run the image WE JUST PUSHED to ensure it's valid
          docker run -d --name test-server -m 2g -e EULA=TRUE $REGISTRY/$REPOSITORY:latest

          echo "Waiting for Minecraft to say 'Done'..."
          for i in {1..20}; do
            if docker logs test-server 2>&1 | grep -q "Done"; then
              echo "✅ Smoke test passed!"
              docker stop test-server && docker rm test-server
              exit 0
            fi
            echo "Attempt $i: Server still starting..."
            sleep 10
          done

          echo "❌ Smoke test failed!"
          docker logs test-server
          exit 1
