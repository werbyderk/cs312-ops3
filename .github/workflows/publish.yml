name: Publish Minecraft Image
on:
  push:
    tags:
      - "v*"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # Remove the ECR_REGISTRY env from here!
    env:
      REPOSITORY: minecraft-server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr # <--- This ID is the "source" for the registry URL
        uses: aws-actions/amazon-ecr-login@v2

      - name: Pull, Tag, and Push Image
        env:
          # Pinning to a specific Java version as you requested earlier
          UPSTREAM_IMAGE: itzg/minecraft-server:java17-alpine
          IMAGE_TAG: ${{ github.ref_name }}
          # Reference the output directly in the step env
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker pull $UPSTREAM_IMAGE
          docker tag $UPSTREAM_IMAGE $REGISTRY/$REPOSITORY:$IMAGE_TAG
          docker tag $UPSTREAM_IMAGE $REGISTRY/$REPOSITORY:latest

      - name: Smoke Test
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          # Use the variable defined in this step's env
          docker run -d --name test-server -e EULA=TRUE $REGISTRY/$REPOSITORY:${{ github.ref_name }}
          echo "Waiting for server to initialize..."
          for i in {1..12}; do
            if docker logs test-server 2>&1 | grep -q "Done"; then
              echo "Smoke test passed!"
              docker rm -f test-server
              exit 0
            fi
            sleep 10
          done
          echo "Smoke test failed!"
          docker logs test-server
          exit 1

      - name: Push to ECR
        run: |
          # You can also just use the context directly in the command
          docker push ${{ steps.login-ecr.outputs.registry }}/$REPOSITORY:${{ github.ref_name }}
          docker push ${{ steps.login-ecr.outputs.registry }}/$REPOSITORY:latest
