apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "minecraft.fullname" . }}
  namespace: {{ .Values.namespace }}
spec:
  serviceName: {{ include "minecraft.fullname" . }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "minecraft.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "minecraft.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.image.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: minecraft
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.port }}
            - containerPort: {{ .Values.minecraft.rcon.port }}
              name: rcon
          env:
            - name: EULA
              value: {{ .Values.minecraft.eula | quote }}
            - name: MOTD
              value: {{ .Values.minecraft.motd | quote }}
            - name: MAX_PLAYERS
              value: {{ .Values.minecraft.maxPlayers | quote }}
            - name: DIFFICULTY
              value: {{ .Values.minecraft.difficulty | quote }}
            - name: ENABLE_RCON
              value: "TRUE"
            - name: RCON_PORT
              value: {{ .Values.minecraft.rcon.port | quote }}
            - name: RCON_PASSWORD
              value: {{ .Values.minecraft.rcon.password | quote }}
          volumeMounts:
            - name: world-data
              mountPath: /data
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          startupProbe:
            tcpSocket:
              port: {{ .Values.service.port }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
          livenessProbe:
            tcpSocket:
              port: {{ .Values.service.port }}
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
          readinessProbe:
            tcpSocket:
              port: {{ .Values.service.port }}
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
        {{- if .Values.exporter.enabled }}
        - name: exporter
          image: "{{ .Values.exporter.image.repository }}:{{ .Values.exporter.image.tag }}"
          args:
            - export-for-prometheus
            - -servers
            - localhost:{{ .Values.service.port }}
          ports:
            - containerPort: 8080
              name: metrics
          resources:
            {{- toYaml .Values.exporter.resources | nindent 12 }}
        {{- end }}
      volumes:
        - name: world-data
          persistentVolumeClaim:
            claimName: {{ include "minecraft.fullname" . }}-data
