apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minecraft
  namespace: minecraft
spec:
  serviceName: minecraft
  replicas: 1
  selector:
    matchLabels:
      app: minecraft
  template:
    metadata:
      labels:
        app: minecraft
    spec:
      imagePullSecrets:
        - name: ecr-cred
      containers:
        - name: minecraft
          image: "133610650551.dkr.ecr.us-east-1.amazonaws.com/minecraft-server:v1.1.8" # <-- edit tag as needed
          ports:
            - containerPort: 25565
          env:
            - name: EULA
              value: "TRUE"
            - name: MOTD
              valueFrom:
                configMapKeyRef:
                  name: minecraft-config
                  key: server.properties # the whole file; the container reads it on start
          volumeMounts:
            - name: world-data
              mountPath: /data # Minecraft server expects its world at /data
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "1"
              memory: "2Gi"
          # -------------------------------------------------------------
          # Probes – tuned for a Java server that can take a while to start
          # -------------------------------------------------------------
          startupProbe:
            tcpSocket:
              port: 25565
            failureThreshold: 30 # 30 × 10s = 5 min before giving up
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 25565
            initialDelaySeconds: 60
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: 25565
            initialDelaySeconds: 30
            periodSeconds: 15
      volumes:
        - name: world-data
          persistentVolumeClaim:
            claimName: minecraft-data
